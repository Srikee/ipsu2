<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Ionic App</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta name="viewport"
        content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- ใช้ธีมล่าสุดของผู้ใช้ตั้งแต่ก่อน Angular โหลด (ค่าเดียวกับ ThemeService) -->
    <style>
        html, body { background: #ffffff; }
        html.dark, html.dark body { background: #0A214B; }
    </style>
    <script>
        (function () {
            var pref = 'system';
            try { pref = localStorage.getItem('ipsu-theme-boot') || 'system'; } catch (e) { }
            var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (dark) {
                document.documentElement.classList.add('dark', 'ion-palette-dark');
                document.documentElement.style.colorScheme = 'dark';
            }
        })();
    </script>
</head>

<body>
    <app-root></app-root>
</body>

</html>
